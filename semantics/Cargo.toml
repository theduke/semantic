[package]
name = "semantics"
version = "0.1.0"
authors = ["Christoph Herzog <chris@theduke.at>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { version = "1.0.40" }
futures = "0.3.15"
tokio = { version = "1.6.1", features = ["full"] }
serde_json = "1.0.64"
semantics_core = { path = "../semantics_core" }
logfs = { path = "../logfs" }
tracing = "0.1.26"
tracing-subscriber = { version = "0.2.18", features = ["fmt"] }
webkit2gtk = { version =  "0.11.0", features = [ "v2_4", "v2_6",  "v2_16", "v2_22", "v2_26"] }
gtk = "0.9.2"
gio = "0.9.1"
base64 = "0.13.0"
glib = "0.10.3"
mime_guess = "2.0.3"
javascriptcore-rs = "0.10.0"
reqwest = { version =  "0.11.3", default-features = false, features = ["gzip", "json", "rustls-tls"] }
hyper = { version =  "0.14.9", features = ["server", "http1"] }
