[package]
name = "ui2"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow.workspace = true
base64 = "0.21.0"
dioxus = "0.3.2"
dioxus-router = { version = "0.3.0", features = ["web"] }
dioxus-web = "0.3.1"
factdb = { workspace = true }
futures.workspace = true
getrandom = { version = "0.2.8", features = ["js"] }
js-sys = "0.3.61"
semantic_core = { git = "https://github.com/theduke/semantic", version = "0.1.0" }
serde_json = "1.0.93"
wasm-bindgen = "0.2.84"
wasm-bindgen-futures = "0.4.34"
web-sys = { version = "0.3.61", features = ["RequestInit", "RequestMode", "Request", "Response", "File", "Headers"] }
