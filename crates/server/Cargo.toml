[package]
name = "semantic_server"
authors.workspace = true
keywords.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true
rust-version.workspace = true
categories.workspace = true
version.workspace = true

[features]
default = ["redb"]
embed-ui = ["dep:include_dir", "dep:mime_guess"]
logfs = ["dep:semantic_db_log"]
redb = ["dep:semantic_db_redb"]

[dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.7", default-features = true, features = ["json", "ws"] }
bytes = { workspace = true }
futures-util = "0.3.31"
http = "1.3.1"
include_dir = { version = "0.7.4", optional = true }
mime_guess = { version = "2.0.5", optional = true }
semantic_app = { path = "../app" }
semantic_data = { workspace = true }
semantic_db_core = { path = "../db_core" }
semantic_db_log = { path = "../db_log", optional = true }
semantic_db_redb = { path = "../db_redb", optional = true }
semantic_media = { path = "../media", default-features = false }
semantic_rpc = { path = "../rpc", features = ["server-axum-ws"] }
serde_json = { workspace = true }
thiserror = "2.0.17"
tokio = { workspace = true, features = ["net", "rt-multi-thread", "sync"] }
tracing = { workspace = true }

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }
