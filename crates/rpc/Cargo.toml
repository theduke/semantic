[package]
name = "semantic_rpc"
authors.workspace = true
keywords.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true
rust-version.workspace = true
categories.workspace = true
version.workspace = true

[features]
default = []
server-axum = ["dep:axum", "dep:http", "dep:tower"]
server-axum-ws = ["server-axum", "axum/ws", "dep:futures-util", "dep:tokio"]
client-http = ["dep:reqwest"]
client-ws = [
  "dep:futures",
  "dep:futures-util",
  "dep:tokio",
  "dep:tokio-tungstenite",
  "dep:gloo-net",
  "dep:wasm-bindgen-futures",
]

[dependencies]
semantic_data = { workspace = true }

futures = { version = "0.3.31", optional = true }
futures-util = { version = "0.3.31", optional = true }
http = { version = "1.3.1", optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = "2.0.17"
tower = { version = "0.5.2", optional = true }

axum = { version = "0.8.7", optional = true, default-features = true, features = ["json"] }
reqwest = { version = "0.12.24", optional = true, default-features = false, features = ["json"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, optional = true, features = ["rt", "sync"] }
tokio-tungstenite = { version = "0.28.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = { version = "0.6.0", optional = true }
wasm-bindgen-futures = { version = "0.4.55", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
