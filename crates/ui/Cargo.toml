[package]
name = "semantic_ui"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
semantic_core = { path = "../core" }
semantic_ui_core = { path = "../ui_core" }
semantic_extra = { path = "../plugins/extra" }

brass = { workspace = true, features = ["macros"] }
# brass_bulma = "0.1"
factdb = { workspace = true, default-features = false }
anyhow.workspace = true
futures.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["js", "v4"] }
url.workspace = true
tracing.workspace = true

console_error_panic_hook = "0.1.7"
tracing-wasm = "0.2.1"
wasm-bindgen = "0.2.83"
wasm-bindgen-futures = "0.4.33"
js-sys = "0.3.60"
getrandom = { version = "0.2.7", features = ["js"] }
rand = "0.8.5"
bytesize = "1.1.0"

[dependencies.web-sys] 
version = "0.3.60"
features = [
  "Event",
  "InputEvent",
  "KeyboardEvent",
  "HtmlInputElement",
  "FileList",
  "File",
  "Headers",
  "Request",
  "RequestInit",
  "RequestMode",
  "Response",
  "Window",
  "History",
  "HtmlVideoElement",
  "HtmlAudioElement",
  "HtmlMediaElement",
  "HtmlAnchorElement",
  # Clipboard stuff.
  "ClipboardEvent",
  "DataTransfer",
  "Url",
  "Blob",
]
