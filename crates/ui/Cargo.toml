[package]
name = "semantic_ui"
authors.workspace = true
keywords.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true
rust-version.workspace = true
categories.workspace = true
version.workspace = true

[features]
default = []
web = ["dioxus/web", "semantic_rpc/client-http-web"]
desktop = ["dioxus/desktop", "semantic_rpc/client-http-native"]
standalone = [
  "desktop",
  "dep:async-trait",
  "dep:semantic_app",
  "dep:semantic_db_core",
  "dep:semantic_db_redb",
]

[dependencies]
async-trait = { version = "0.1.89", optional = true }
dioxus = { workspace = true, features = ["router"] }
dxcomp = { path = "../dxcomp" }
futures = "0.3.31"
semantic_app = { path = "../app", optional = true }
semantic_data = { workspace = true }
semantic_db_core = { path = "../db_core", optional = true }
semantic_db_redb = { path = "../db_redb", optional = true }
semantic_rpc = { path = "../rpc", features = ["client"] }
semantic_ui_core = { path = "../ui_core" }
