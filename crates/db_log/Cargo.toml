[package]
name = "semantic_db_log"
authors.workspace = true
keywords.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true
rust-version.workspace = true
categories.workspace = true
version.workspace = true

[dependencies]
bytes = { workspace = true }
logfs = { git = "https://github.com/theduke/logfs", rev = "367d386360b4c21d20bf4940a0894eec1edcff50" }
objstore = "0.1.0-alpha.3"
rmp-serde = "1.3.0"
serde = { workspace = true, features = ["derive"] }
semantic_data = { workspace = true }
semantic_db_core = { path = "../db_core", features = ["tokio"] }
semantic_db_kv = { path = "../db_kv" }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[dev-dependencies]
objstore_fs = "0.1.0-alpha.3"
semantic_db_test = { path = "../db_test" }
tempfile = "3.23.0"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
