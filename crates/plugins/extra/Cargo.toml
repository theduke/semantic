[package]
name = "semantic_extra"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["ui"]

ui = ["semantic_ui_core", "brass"]


[dependencies]
semantic_core = { version = "0.1", path = "../../core" }
semantic_ui_core = { version = "0.1", optional = true, path = "../../ui_core" }

anyhow.workspace = true
brass = { workspace = true, optional = true }
factdb = { workspace = true, default-features = false }
serde = { workspace = true, features = ["derive"] }
time = { workspace = true }

tracing = "0.1.36"

