[package]
name = "semantic_db_core"
authors.workspace = true
keywords.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true
rust-version.workspace = true
categories.workspace = true
version.workspace = true

[features]
default = ["sql", "prql"]
sql = ["dep:sqlparser"]
prql = ["dep:prqlc"]

[dependencies]
async-trait = "0.1.89"
semantic_data = { workspace = true }
facet = { version = "0.43.2", features = ["time", "uuid", "bytes"] }
futures = "0.3.31"
fnv = "1.0.7"
thiserror = "2.0.17"
regex = "1.11.1"
sqlparser = { version = "0.61.0", optional = true }
prqlc = { version = "0.13", optional = true }
