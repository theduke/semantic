[package]
name = "semantic"
version = "0.1.0"
authors = ["Christoph Herzog <chris@theduke.at>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
webkit = ["webkit2gtk", "javascriptcore-rs", "gtk", "gio", "glib"]
archive = ["tar", "flate2"]

media-optimizers = ["oxipng", "mozjpeg"]

jsonschema = ["semantic_core/schema"]

default = ["archive"]

[dependencies]
base64 = "0.13.0"
serde_json = "1.0.64"

anyhow = { version = "1.0.40", features = ["backtrace"] }
tracing = "0.1.26"
tracing-subscriber = { version = "0.3.3", features = ["fmt", "env-filter"] }

mime_guess = "2.0.3"
infer = "0.7.0"

# async
futures = "0.3.15"
tokio = { version = "1.17.0", features = ["full"] }
tokio-util = { version = "0.7.0", features = ["io", "codec"] }

# http
reqwest = { version =  "0.11.3", default-features = false, features = ["gzip", "json", "rustls-tls", "stream"] }
hyper = { version =  "0.14.9", features = ["server", "http1"] }

# webkit-gtk
webkit2gtk = { version =  "0.15.0", features = [ "v2_4", "v2_6",  "v2_16", "v2_22", "v2_26"] , optional = true }
javascriptcore-rs = { version =  "0.15.1", optional = true }
gtk = { version = "0.14.0", optional = true }
gio = { version = "0.14.0", optional = true }
glib = { version = "0.14.0", optional = true }

factordb = "0.1"
factor_engine = "0.1"
factor_tools = "0.1"

jsonwebtoken = { version = "8.1.0" }
serde = { version = "1.0.127", features = ["derive"] }
axum = "0.5.12"

tower-http = { version = "0.3.0", features = ["trace", "fs", "compression-gzip"] }
dirs = "4.0.0"
tower = "0.4.8"

logfs = { path = "../logfs" }
sha2 = "0.10.0"
structopt = "0.3.23"
uuid = { version = "1.1.2", features = ["v4"] }
url = "2.2.2"
serde_path_to_error = "0.1.7"

oxipng = { version = "5.0.0", optional = true, default-features = false, features = ["parallel", "zopfli"] }
mozjpeg = { version = "0.9.1", optional = true }

semantic_core = { path = "../core" }
semantic_extra = { version = "0.1", path = "../plugins/extra", default-features = false }
headers = "0.3.5"

tar = { version =  "0.4.37", optional = true }
flate2 = { version = "1.0.22", optional = true }
rust-embed = { version = "6.3.0", features = ["interpolate-folder-path"] }
ffprobe = "0.3.2"
bytesize = "1.1.0"
clap = { version = "3.1.15", features = ["derive", "env"] }
bytes = "1.1.0"
tracing-futures = "0.2.5"
pin-project-lite = "0.2.9"

