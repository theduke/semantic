<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>dxeditor browser fixture</title>
    <style>
      .dxeditor { position: relative; width: 760px; margin: 80px auto; }
      [data-dxeditor-host] { min-height: 300px; padding: 30px 64px; }
      [data-dxeditor-overlays] { position: absolute; inset: 0; pointer-events: none; }
      .dxeditor-engine__surface { position: absolute; z-index: 2; display: flex; gap: 4px; padding: 4px; background: white; border: 1px solid #aaa; pointer-events: auto; }
      .dxeditor-engine__surface[hidden] { display: none; }
      .dxeditor-engine__slash, .dxeditor-engine__block-menu, .dxeditor-engine__link-popover { flex-direction: column; }
      .dxeditor-engine__block-controls { border: 0; box-shadow: none; padding: 0; }
      .dxeditor-engine__entity-link { color: var(--dxeditor-entity-link-color, #176b87); }
      .dxeditor-engine__table-controls, .dxeditor-engine__table-row-controls { position: absolute; inset: 0; pointer-events: none; }
      .dxeditor-engine__table-controls[hidden], .dxeditor-engine__table-row-controls[hidden] { display: none; }
      .dxeditor-engine__table-controls .dxeditor-engine__button, .dxeditor-engine__table-row-handle { position: absolute; z-index: 2; box-sizing: border-box; border: 1px solid #aaa; background: white; pointer-events: auto; }
      .dxeditor-engine__table-add-row { min-height: 24px; padding: 0; }
      .dxeditor-engine__table-add-column { min-width: 24px; padding: 0; }
      .dxeditor-engine__table-row-handle { min-width: 28px; min-height: 28px; padding: 2px 4px; cursor: grab; }
      table, td, th { border: 1px solid #888; border-collapse: collapse; padding: 4px; }
    </style>
  </head>
  <body>
    <main class="dxeditor">
      <h1>dxeditor browser fixture</h1>
      <div data-dxeditor-host="fixture"></div>
      <div data-dxeditor-overlays></div>
    </main>
    <script src="../dist/editor.iife.js"></script>
    <script>
      const initialDocument = {
        schema: 'semantic.component-document',
        version: 2,
        root: {
          kind: 'document',
          content: [{
            id: 'block-1', kind: 'paragraph',
            content: [{ kind: 'text', text: 'Select this text' }],
          }],
        },
      };
      window.editorEvents = [];
      window.editorSession = SemanticEditorEngine.mount(
        document.querySelector('[data-dxeditor-host]'),
        {
          sessionId: 'fixture',
          schemaFingerprint: 'fixture-schema',
          document: initialDocument,
          readonly: false,
          emit: event => window.editorEvents.push(event),
          mentionProvider: async query => [
            { id: 'entity-alice', label: 'Alice', detail: 'Person' },
            { id: 'entity-alpine', label: 'Alpine', detail: 'Project' },
          ].filter(item => item.label.toLowerCase().includes(query.toLowerCase())),
          entitySearchProvider: async query => [
            { id: 'entity-ada', label: 'Ada Lovelace', detail: 'Person' },
            { id: 'entity-atlas', label: 'Atlas', detail: 'Project' },
          ].filter(item => item.label.toLowerCase().includes(query.toLowerCase())),
          entityPreviewProvider: async entityId => entityId === 'entity-ada' ? {
            id: entityId,
            label: 'Ada Lovelace',
            detail: 'Person',
            fields: [{ label: 'Email', value: 'ada@example.test' }],
          } : null,
          entityOpenHandler: entityId => { window.openedEntity = entityId; },
          entityLinkColor: '#7c3aed',
        },
      );
    </script>
  </body>
</html>
