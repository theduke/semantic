[package]
name = "semantic_ui_core"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
semantic_core = { path = "../core" }

brass.workspace = true
factdb = { workspace = true, default-features = false }
anyhow.workspace = true
futures.workspace = true
serde_json.workspace = true
url.workspace = true
time = { workspace = true, features = ["serde", "formatting", "parsing", "wasm-bindgen", "macros"] }

# brass_bulma = "0.1"
fnv = "1.0.7"
js-sys = "0.3.60"
pulldown-cmark = "0.9.2"

tracing = "0.1.36"
wasm-bindgen = "0.2.83"
wasm-bindgen-futures = "0.4.33"

once_cell = "1.15.0"
form_urlencoded = "1.1.0"
base64 = "0.13.0"


[dependencies.web-sys] 
version = "0.3.60"
features = [
    "HtmlVideoElement", 
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "File", 
    "Response", 
    "RequestInit",
    "RequestMode",
    "Request",
    "Headers",
]
