[package]
name = "semantic_app"
authors.workspace = true
keywords.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true
rust-version.workspace = true
categories.workspace = true
version.workspace = true

[features]
default = ["base", "plugin-stdio", "plugin-websocket"]
base = ["dep:semantic_base"]
plugin-stdio = ["semantic_plugin/stdio"]
plugin-websocket = ["semantic_plugin/websocket"]
storage-redb = ["dep:semantic_db_redb"]
storage-logfs = ["dep:semantic_db_log", "dep:objstore_logfs"]

[dependencies]
semantic_rpc_core = { path = "../rpc_core" }
async-trait = "0.1.89"
bytes = { workspace = true }
dirs = "6.0.0"
futures-util = "0.3.31"
hex = { workspace = true }
objstore = { workspace = true }
objstore_fs = { workspace = true }
ordered-float = { workspace = true }
redb = "2.6.3"
semantic_data = { workspace = true }
semantic_jobs = { path = "../jobs" }
semantic_plugin = { path = "../plugin" }
semantic_import = { path = "../import" }
semantic_base = { path = "../base", optional = true }
semantic_db_core = { path = "../db_core" }
semantic_db_redb = { path = "../db_redb", optional = true }
semantic_db_log = { path = "../db_log", optional = true }
objstore_logfs = { workspace = true, optional = true }
semantic_media = { path = "../media" }
semantic_rpc = { path = "../rpc" }
facet-json = "0.43.2"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = { workspace = true }
tar = "0.4.44"
tempfile = "3.26.0"
thiserror = "2.0.17"
time = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "rt", "sync", "time"] }
tokio-util = { version = "0.7.17", features = ["io"] }
url = "2.5.7"
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
serde_json.workspace = true
tokio-tungstenite = "0.28"
semantic_db_postgres = { path = "../db_postgres" }
semantic_db_redb = { path = "../db_redb" }
tokio = { workspace = true, features = ["macros", "rt"] }
