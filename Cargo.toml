[workspace]
members = [
    "crates/core",
    "crates/semantic",
    "crates/logfs",

    "crates/ui_core",
    "crates/ui",

    "crates/contrib",
]

exclude = [
    "crates/xtask",
]

[patch.crates-io]
brass = {path = "../brass"}
brass_bulma = {path = "../brass/brass_bulma"}
factordb = { path = "../factordb/factordb"}
factor_tools = { path = "../factordb/factor_tools" }
