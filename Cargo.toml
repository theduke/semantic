[workspace]
resolver = "3"
members = ["crates/*"]
exclude = [
  # ...
]

[workspace.package]
authors = ["Christoph Herzog <chris@theduke.at>"]
keywords = []
repository = "https://github.com/semantiverse/semantic"
homepage = "https://semantiverse.io"
license = "MIT"
readme = "README.md"
edition = "2024"
rust-version = "1.90"
categories = []

version = "0.0.1"

[workspace.dependencies]

# Repo-local
semantic_data = { path = "crates/data" }

# objstore_logfs is not published; pin all objstore crates to the same release.
objstore = { git = "https://github.com/theduke/objstore", rev = "061a7fe3dcfd3707d886b0b74f4a99036162aeae" }
objstore_fs = { git = "https://github.com/theduke/objstore", rev = "061a7fe3dcfd3707d886b0b74f4a99036162aeae" }
objstore_logfs = { git = "https://github.com/theduke/objstore", rev = "061a7fe3dcfd3707d886b0b74f4a99036162aeae" }


# crates.io

serde = "1.0.228"
serde_json = "1.0.145"
time = "0.3.47"
bytes = "1.11.1"
hex = "0.4.3"
ordered-float = "5.1.0"
sha2 = "0.10.9"
uuid = "1.21.0"
anyhow = "1"
tokio = "1.48.0"
tracing = "0.1.44"
dioxus = "0.7.9"

[patch.crates-io]
# Use the same logfs fixes for direct database and object-store access.
logfs = { git = "https://github.com/theduke/logfs", rev = "367d386360b4c21d20bf4940a0894eec1edcff50" }
