<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Semantic settings</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="options.js" defer></script>
  </head>
  <body class="options-page">
    <main>
      <header>
        <p class="eyebrow">Semantic</p>
        <h1>Connection settings</h1>
        <p class="intro">Connect the extension to your Semantic application.</p>
      </header>
      <form id="config-form">
        <label for="base-url">Semantic application URL</label>
        <input
          id="base-url"
          name="base-url"
          type="url"
          inputmode="url"
          placeholder="http://127.0.0.1:8888"
          autocomplete="url"
          required
        />
        <p class="help">
          Include a path prefix if your application is hosted below one.
        </p>
        <button id="save" type="submit">Save settings</button>
      </form>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
